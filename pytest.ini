[pytest]
testpaths = tests
addopts = -m "not slow"
markers =
    slow: marks tests as slow/network-bound (deselect with '-m "not slow"')
    bound: Layer 2 reasonability bounds — warn on close calls, fail hard on wide misses
    snapshot: pinned values that drift with data; update intentionally
filterwarnings =
    ignore::UserWarning:streamlit
    ignore:.*ScriptRunContext.*:UserWarning
