[pytest]
testpaths = tests
addopts = -m "not slow and not live_data"
# A PASSING TEST'S tmp_path GOES WHEN THE TEST ENDS (#713). Under the default, "all",
# every test's tmp_path stays until the session ends, and the suite's tests copy whole
# books into theirs: measured at e6b2725, 16.0 GB stayed in pytest's temp folders, 7.5
# GB of it in 221 copies of data/demo.db and 4.7 GB in 388 of the frozen test book.
# #712's run died out of disk partway into the suite (41742004956). pytest 9.1.1's
# reference (doc/en/reference/reference.rst, tmp_path_retention_policy): "`failed`:
# retains directories only for tests with outcome `error` or `failed`." Its tmp_path
# fixture removes a passing test's directory at teardown under "failed" only;
# "none", which the same page says removes every one, removes none while the session
# runs in 9.1.1 (_pytest/tmpdir.py). A failing test keeps its directory to read.
tmp_path_retention_policy = failed
markers =
    slow: marks tests as slow/network-bound (deselect with '-m "not slow"')
    bound: Layer 2 reasonability bounds — warn on close calls, fail hard on wide misses
    snapshot: pinned values that drift with data; update intentionally
    live_data: tests that make live API calls to external services (FRED, Yahoo, etc.); excluded from default suite, opt in via -m live_data
filterwarnings =
    ignore::UserWarning:streamlit
    ignore:.*ScriptRunContext.*:UserWarning
