# Keeps the public Streamlit Cloud demo awake with a real headless browser.
#
# Streamlit Community Cloud's free tier sleeps an app after ~12h of
# inactivity, and a plain HTTP ping does NOT wake it (it gets a 200 static
# shell while the Python backend stays asleep). This workflow opens the app
# in real headless Chromium (Playwright), which runs the page JS / opens the
# WebSocket and clicks the wake button if the app has gone to sleep.
#
# NOTE: GitHub scheduled workflows are best-effort and can be delayed under
# load, but a 3-hour cadence against a ~12-hour sleep timer leaves ample
# margin even if a run or two slips.

name: Keep Streamlit demo awake

on:
  schedule:
    # Every 3 hours.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  wake:
    # PINNED TO ubuntu-24.04, NOT ubuntu-latest, for the reason ci.yml gives: GitHub
    # moves ubuntu-latest to Ubuntu 26.04 gradually between October 19 and November
    # 19, 2026. This job runs no tests, but `playwright install --with-deps` installs
    # OS packages, and a wake that fails on the new image lets the demo sleep (decided
    # by the owner, October 15, 2026). Moving to 26.04 is part of the trial in #585.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit demo (wake if asleep)
        run: python scripts/keep_awake.py
