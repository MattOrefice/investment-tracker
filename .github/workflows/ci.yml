name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libgobject-2.0-0 libffi-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Show key package versions (diagnostic)
        run: pip show streamlit weasyprint kaleido statsmodels | grep -E "^(Name|Version):"

      - name: Guard — render_sidebar_footer called in app.py
        run: grep -n "render_sidebar_footer" app.py

      - name: Guard — render_page_header called in all inner pages
        run: grep -rn "render_page_header" pages/

      - name: Guard — no account-number-shaped literals in tracked text files
        run: |
          hits=$(git ls-files -z -- ':!:*.db' ':!:*.csv' ':!:*.png' ':!:*.jpg' ':!:*.jpeg' ':!:*.gif' ':!:*.ico' ':!:*.pdf' ':!:*.xlsx' \
            | xargs -0 -r grep -InEH '(\b[0-9]{9}\b|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})' || true)
          if [ -n "$hits" ]; then
            echo "Account-number-shaped literals found in tracked files (file:line only):"
            printf '%s\n' "$hits" | sed -E 's/^([^:]+):([0-9]+):.*/\1:\2/'
            exit 1
          fi
          echo "OK — no account-number-shaped literals in tracked text files."

      - name: Run fast tests (slow/network tests excluded)
        # Exclusions live in pytest.ini addopts (not slow and not live_data). Do NOT add a CLI -m here — it overrides addopts and silently re-includes the live_data tests (live external API calls on every push).
        run: python -m pytest --tb=long -q
        env:
          TRACKER_MODE: demo
