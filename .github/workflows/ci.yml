name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # PINNED TO ubuntu-24.04, NOT ubuntu-latest (decided by the owner, October 15,
    # 2026). GitHub moves ubuntu-latest to Ubuntu 26.04 gradually between October 19
    # and November 19, 2026, so during that month one SHA could run on either image,
    # and a green run would not say which image it was green on. live-data.yml is
    # pinned the same way. Moving to 26.04 is a trial for later (#585).
    runs-on: ubuntu-24.04

    # A HUNG RUN IS WORSE THAN A FAILED ONE. A failure is a signal; a hang is the
    # absence of one, and an absence invites "it would have passed" — the exact
    # substitution this repo's merge discipline forbids. CI-green-BY-SHA is one of
    # three merge proofs, so a run that can neither pass nor fail breaks a
    # verification leg rather than merely being annoying.
    #
    # Without this the job inherits GitHub's 360-minute default. Measured normal for
    # the whole job: about 6 minutes on GitHub's runner with the suite on four workers,
    # as of October 14, 2026 (run 38636521102, #544's trial: 368, 318 and 391 s, against
    # 735 s for a serial job on the same commit). An approximation dated to its
    # measurement, not a range: a single run can take longer. 30 is more than 2x the
    # serial job too, and cannot fire on a merely slow run. This is the backstop for
    # every step with no timeout of its own; the step-level values below are tighter
    # where a normal has been measured.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version: "3.11"
          cache: "pip"

      # REMOVED: an apt step installing WeasyPrint's Pango/HarfBuzz system libs.
      # The identical step survived in live-data.yml when this comment was first
      # written, so "removed" described this file only; it is now gone from both,
      # and that workflow carries the same note.
      #
      # It hung indefinitely on `apt-get update -qq` on 2026-08-18 — twice on the same
      # SHA, for 25 and 17 minutes, against a measured 6-second normal (run
      # 32085457063, step 4: 00:41:28 -> 00:41:34). `-qq` suppressed the mirror output,
      # so the step showed nothing at all rather than what it was waiting on.
      #
      # IT GUARDED NOTHING HERE. weasyprint is imported function-locally at
      # src/reports.py:236, so importing src.reports — which tests/test_imports.py does
      # for every module — never touches the libs. The only test that reaches the render
      # is tests/test_market_data_immutability.py::test_pdf_build_writes_no_tracked_data,
      # and it wraps the call in `except Exception: pass` BY DESIGN: its stated guarantee
      # is that no tracked file was written, not that the PDF builds. So it passes
      # identically with or without the libs, and nothing CI asserts depended on this
      # step.
      #
      # THE LIBS ARE STILL REQUIRED AT RUNTIME on Streamlit Cloud, via packages.txt. Do
      # not read this removal as "WeasyPrint needs nothing" — it means CI does not verify
      # the PDF path, which it did not verify before either.
      #
      # Before re-adding, two things are on record: CI's list was a SUPERSET of
      # packages.txt by two packages (libgobject-2.0-0, libffi-dev), tracked separately;
      # and whether CI should cover the PDF build is a decision about tightening that
      # test, which is a different question from this one and is filed, not assumed.

      - name: Install Python dependencies
        run: pip install -r requirements-ci.txt
        # requirements-ci.txt is requirements.txt plus pytest-xdist, which only the test
        # run needs. Streamlit Cloud installs requirements.txt alone, so the deployed app
        # never carries it (#544).
        # pip is now the only network-bound install step and the natural heir to the
        # hang risk. Observed normal ~30s (00:41:34 -> 00:42:03).
        timeout-minutes: 5

      - name: Show key package versions (diagnostic)
        run: pip show streamlit weasyprint kaleido plotly statsmodels pytest-xdist | grep -E "^(Name|Version):"

      - name: Guard — render_sidebar_footer called in app.py
        run: grep -n "render_sidebar_footer" app.py

      - name: Guard — render_page_header called in all inner pages
        run: grep -rn "render_page_header" pages/

      - name: Guard — no account-number-shaped literals in tracked text files
        # Shape set kept in lockstep with LITERAL_RE in scripts/scan_committed_dbs_pii.py
        # (imported by tests/test_pii_guards.py). POSIX ERE here, Python re there.
        run: |
          hits=$(git ls-files -z -- ':!:*.db' ':!:*.csv' ':!:*.png' ':!:*.jpg' ':!:*.jpeg' ':!:*.gif' ':!:*.ico' ':!:*.pdf' ':!:*.xlsx' \
            | xargs -0 -r grep -InEH '(\b[0-9]{9}\b|\b[A-Z][0-9]{6,}\b|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|@[Ff]idelity)' || true)
          if [ -n "$hits" ]; then
            echo "Account-number-shaped literals found in tracked files (file:line only):"
            printf '%s\n' "$hits" | sed -E 's/^([^:]+):([0-9]+):.*/\1:\2/'
            exit 1
          fi
          echo "OK — no account-number-shaped literals in tracked text files."

      - name: Guard — no account-number-shaped values in committed databases
        # The step above skips *.db, but a value inside a committed SQLite file is
        # invisible to a text grep and is exactly what a page renders (Household
        # View). This opens each committed DB and checks its accounts table the way
        # the page reads it. Lockstep with tests/test_pii_guards.py.
        run: python scripts/scan_committed_dbs_pii.py

      - name: Run fast tests (slow/network tests excluded)
        # Exclusions live in pytest.ini addopts (not slow and not live_data). Do NOT add a CLI -m here — it overrides addopts and silently re-includes the live_data tests (live external API calls on every push).
        run: python -m pytest --tb=long -q -n 4
        # Four workers (pytest-xdist, -n 4), as the owner decided on October 14, 2026
        # (#544), after a trial on one commit gave all 3,368 tests the same outcome and
        # message serially and in three runs with -n 4 (run 38636521102). A test whose
        # outcome differs between a serial run and a parallel one, now or later, is a
        # STOP: compare them by test id, outcome and message, as the trial did.
        # Measured normal: about 5 minutes on GitHub's runner, as of October 14, 2026
        # (run 38636521102: 326, 274 and 346 s for this step with -n 4, against 694 s
        # serially on the same commit). An approximation dated to its measurement, not
        # a range: a single run can take longer, and the next measurement replaces this
        # one. This is where the suite's duration is kept: the README states none,
        # because a typed duration is out of date after the next PR that adds render
        # tests (#533). Re-measure it here when a limit changes. 20
        # leaves room for a slow runner while still bounding a hang — a slow test run
        # and a hung one deserve different verdicts. At a limit of 10 the serial normal
        # reached it: two push runs on main were cut off on October 13 with no test
        # failing. 20 also holds a serial run (685 s, run 38596909747), so the limit
        # stands if the suite ever runs without -n.
        timeout-minutes: 20
        env:
          TRACKER_MODE: demo
