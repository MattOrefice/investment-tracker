name: Keepalive ping

on:
  schedule:
    # Every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:  # allow manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Streamlit app
        run: |
          curl -fsSL --max-time 60 \
            -A "GitHubActions-Keepalive/1.0" \
            https://mattorefice-investment.streamlit.app/ \
            -o /dev/null
          echo "Pinged at $(date -u +%FT%TZ)"
