name: live-data

on:
  schedule:
    - cron: "30 9 * * *"   # daily 09:30 UTC
  workflow_dispatch: {}

jobs:
  live-data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      # REMOVED: an apt step installing WeasyPrint's Pango/HarfBuzz system libs,
      # matching the removal from ci.yml (PR #256). Same reasoning, re-verified for
      # THIS job's selection rather than assumed from the other one:
      #
      # weasyprint is imported function-locally at src/reports.py:236, and no
      # live_data-marked test imports src.reports — the only matches in the marked
      # set are prose in comments. So nothing this workflow asserts depended on the
      # step. It cost ~5s here and never hung, but it is the same `apt-get update
      # -qq` that hung indefinitely in ci.yml on 2026-08-18 (twice on one SHA, 25
      # and 17 minutes against a 6-second normal), with `-qq` suppressing the mirror
      # output so the step showed nothing at all rather than what it was waiting on.
      #
      # THE LIBS ARE STILL REQUIRED AT RUNTIME on Streamlit Cloud, via packages.txt.
      # Neither removal says WeasyPrint needs nothing — they say CI does not verify
      # the PDF path, which it did not verify before either.

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run live-data integration tests (external API calls)
        # Explicit -m "live_data" intentionally overrides pytest.ini addopts to RUN the
        # normally-excluded set. This is the one workflow allowed to hit live external APIs.
        run: python -m pytest -m "live_data" --tb=long -q
        env:
          TRACKER_MODE: demo
          # FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # not needed — live_data tests use keyless Ken French + Yahoo
