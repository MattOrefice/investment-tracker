name: live-data

on:
  schedule:
    - cron: "30 9 * * *"   # daily 09:30 UTC
  workflow_dispatch: {}

jobs:
  live-data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b \
            libgobject-2.0-0 libffi-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run live-data integration tests (external API calls)
        # Explicit -m "live_data" intentionally overrides pytest.ini addopts to RUN the
        # normally-excluded set. This is the one workflow allowed to hit live external APIs.
        run: python -m pytest -m "live_data" --tb=long -q
        env:
          TRACKER_MODE: demo
          # FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # not needed — live_data tests use keyless Ken French + Yahoo
